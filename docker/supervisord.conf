[supervisord]
nodaemon=true
logfile=/var/log/supervisor/supervisord.log
pidfile=/run/supervisord.pid
user=root

[program:php-fpm]
command=php-fpm -F
autostart=true
autorestart=true
priority=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:nginx]
command=nginx -g "daemon off;"
autostart=true
autorestart=true
priority=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:scheduler]
command=php /var/www/html/artisan schedule:work
directory=/var/www/html
autostart=true
autorestart=true
priority=20
startsecs=5
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:queue-worker]
command=php /var/www/html/artisan queue:work --sleep=3 --tries=3 --max-time=3600
directory=/var/www/html
autostart=true
autorestart=true
priority=20
startsecs=5
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; Reverb runs only if REVERB_APP_KEY is set.
; When the key is empty (e.g. misconfigured prod, or a dev who hasn't set it),
; the program idles instead of crash-looping — supervisorctl still shows RUNNING
; so you can see it, and app falls back to HTTP polling.
[program:reverb]
command=bash -c 'if [ -z "$REVERB_APP_KEY" ] || [ -z "$REVERB_APP_SECRET" ] || [ -z "$REVERB_APP_ID" ]; then echo "[reverb] disabled — REVERB_APP_KEY/SECRET/ID not set"; exec sleep infinity; fi; exec php /var/www/html/artisan reverb:start --host=0.0.0.0 --port=8080'
directory=/var/www/html
autostart=true
autorestart=true
priority=20
startsecs=3
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

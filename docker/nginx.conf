# ═══════════════════════════════════════════════════════════════
#  R A C K S E P H N O X   ·   N G I N X   C O N F I G
#  Laravel 13 · PHP 8.4 FPM · Port 10000 (Render)
#  PHP-FPM reached via TCP 127.0.0.1:9000 (Docker default)
# ═══════════════════════════════════════════════════════════════

# ─── Worker & Process ───
user                    www-data;
worker_processes        auto;
worker_rlimit_nofile    65535;
pid                     /run/nginx.pid;

# ─── Error log (to stdout for Render) ───
error_log               /dev/stderr warn;

# ─── Events ───
events {
    worker_connections  2048;
    multi_accept        on;
    use                 epoll;
}

# ─── HTTP ───
http {
    # ─── MIME & Defaults ───
    include             /etc/nginx/mime.types;
    default_type        application/octet-stream;

    # ─── Logging (to stdout for Render) ───
    log_format          main '$remote_addr - $remote_user [$time_local] '
                             '"$request" $status $body_bytes_sent '
                             '"$http_referer" "$http_user_agent" '
                             'rt=$request_time uct="$upstream_connect_time" '
                             'uht="$upstream_header_time" urt="$upstream_response_time"';
    access_log          /dev/stdout main;

    # ─── Performance ───
    sendfile            on;
    tcp_nopush          on;
    tcp_nodelay         on;
    keepalive_timeout   65;
    keepalive_requests  1000;
    types_hash_max_size 2048;
    server_tokens       off;
    reset_timedout_connection on;
    client_body_timeout 60s;
    client_header_timeout 60s;
    send_timeout        60s;

    # ─── Body size ───
    client_max_body_size 20M;

    # ─── File descriptors ───
    open_file_cache             max=2000 inactive=20s;
    open_file_cache_valid       30s;
    open_file_cache_min_uses    2;
    open_file_cache_errors      on;

    # ─── Gzip ───
    gzip                on;
    gzip_vary           on;
    gzip_proxied        any;
    gzip_comp_level     6;
    gzip_min_length     1024;
    gzip_disable        "msie6";
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/x-javascript
        application/xml
        application/xml+rss
        application/atom+xml
        application/manifest+json
        application/vnd.ms-fontobject
        application/x-font-ttf
        application/font-woff
        application/font-woff2
        font/opentype
        font/woff
        font/woff2
        image/svg+xml
        image/x-icon;

    # ─── Security Headers ───
    add_header X-Frame-Options           "SAMEORIGIN"                    always;
    add_header X-Content-Type-Options    "nosniff"                       always;
    add_header X-XSS-Protection          "1; mode=block"                 always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy        "geolocation=(), microphone=(), camera=()" always;

    # ─── Real IP behind Cloudflare / Render proxy ───
    set_real_ip_from    10.0.0.0/8;
    set_real_ip_from    172.16.0.0/12;
    set_real_ip_from    192.168.0.0/16;
    real_ip_header      X-Forwarded-For;
    real_ip_recursive   on;

    # ═══════════════════════════════════════════════════════════
    #  SERVER BLOCK
    # ═══════════════════════════════════════════════════════════
    server {
        listen                  10000 default_server;
        listen                  [::]:10000 default_server;
        server_name             _;

        root                    /var/www/html/public;
        index                   index.php index.html;

        charset                 utf-8;
        charset_types           text/css text/plain text/xml application/json application/javascript;

        # ─── Request ID for tracing ───
        add_header X-Request-ID $request_id always;

        # ═══════════════════════════════════════════════════════
        #  LARAVEL FRONT CONTROLLER
        # ═══════════════════════════════════════════════════════
        location / {
            try_files $uri $uri/ /index.php?$query_string;
        }

        # ═══════════════════════════════════════════════════════
        #  PHP-FPM — TCP 127.0.0.1:9000 (Docker default)
        # ═══════════════════════════════════════════════════════
        location ~ \.php$ {
            try_files               $uri =404;
            fastcgi_split_path_info ^(.+\.php)(/.+)$;
            fastcgi_pass            127.0.0.1:9000;
            fastcgi_index           index.php;

            include                 fastcgi_params;
            fastcgi_param           SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
            fastcgi_param           DOCUMENT_ROOT   $realpath_root;
            fastcgi_param           HTTPS           $https if_not_empty;

            # ─── Timeouts ───
            fastcgi_connect_timeout 60s;
            fastcgi_send_timeout    300s;
            fastcgi_read_timeout    300s;

            # ─── Buffers ───
            fastcgi_buffer_size         128k;
            fastcgi_buffers             8 128k;
            fastcgi_busy_buffers_size   256k;
            fastcgi_temp_file_write_size 256k;

            # ─── Hide server signatures ───
            fastcgi_hide_header X-Powered-By;
            fastcgi_hide_header X-AspNet-Version;

            # ─── Catch upstream failures ───
            fastcgi_intercept_errors on;
        }

        # ═══════════════════════════════════════════════════════
        #  STATIC ASSETS — long cache
        # ═══════════════════════════════════════════════════════
        location ~* \.(?:css|js|mjs|map|json|jpg|jpeg|gif|png|svg|ico|webp|avif|woff|woff2|ttf|otf|eot)$ {
            expires                 1y;
            access_log              off;
            add_header              Cache-Control "public, immutable";
            try_files               $uri =404;
        }

        # ─── Vite build output (fingerprinted) ───
        location /build/ {
            expires                 1y;
            access_log              off;
            add_header              Cache-Control "public, immutable";
            try_files               $uri =404;
        }

        # ═══════════════════════════════════════════════════════
        #  WELL-KNOWN / SEO / HEALTH
        # ═══════════════════════════════════════════════════════
        location = /favicon.ico { access_log off; log_not_found off; expires 30d; }
        location = /robots.txt  { access_log off; log_not_found off; allow all; }
        location = /health      {
            access_log off;
            try_files $uri /index.php?$query_string;
        }

        # ═══════════════════════════════════════════════════════
        #  SECURITY — Block hidden files
        # ═══════════════════════════════════════════════════════
        location ~ /\.(?!well-known).* {
            deny all;
            access_log off;
            log_not_found off;
        }

        # ─── Block common attack paths ───
        location ~* (\.env|\.git|composer\.(json|lock)|package(-lock)?\.json|artisan|webpack\.mix\.js|phpunit\.xml|\.htaccess)$ {
            deny all;
            access_log off;
            log_not_found off;
        }

        # ─── Block PHP execution in uploads/storage ───
        location ~* ^/(storage|uploads|files|backup_migrations)/.*\.php$ {
            deny all;
        }

        # ═══════════════════════════════════════════════════════
        #  ERROR PAGES
        # ═══════════════════════════════════════════════════════
        error_page 404                     /index.php;
        error_page 500 502 503 504         /50x.html;

        location = /50x.html {
            root /var/www/html/public;
            internal;
        }
    }
}

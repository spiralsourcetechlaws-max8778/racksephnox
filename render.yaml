# ═══════════════════════════════════════════════════════════════
#  RACKSEPHNOX · Render.com Blueprint
#  Infrastructure as Code — one-click deploy
# ═══════════════════════════════════════════════════════════════

services:
  # ─── Web Service (Docker) ───
  - type: web
    name: racksephnox
    runtime: docker
    plan: starter                # Change to "free" for free tier
    region: frankfurt            # Closest to Kenya
    branch: spiral
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: APP_NAME
        value: Racksephnox
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: false
      - key: APP_URL
        value: https://racksephnox.onrender.com
      - key: ASSET_URL
        value: https://racksephnox.onrender.com
      - key: APP_KEY
        sync: false
      - key: APP_TIMEZONE
        value: Africa/Nairobi
      - key: LOG_CHANNEL
        value: stack
      - key: LOG_LEVEL
        value: warning
      - key: DB_CONNECTION
        value: sqlite
      - key: DB_DATABASE
        value: /var/www/html/database/database.sqlite
      - key: SESSION_DRIVER
        value: database
      - key: SESSION_SECURE_COOKIE
        value: true
      - key: SESSION_DOMAIN
        value: null
      - key: CACHE_STORE
        value: file
      - key: QUEUE_CONNECTION
        value: database
      - key: BROADCAST_CONNECTION
        value: log
      - key: MAIL_MAILER
        value: log
      - key: RUN_MIGRATIONS
        value: true
      - key: RUN_SEEDERS
        value: false
    disk:
      name: racksephnox-data
      mountPath: /var/www/html/database
      sizeGB: 1

# ═══════════════════════════════════════════════════════════════
#  NOTES:
#
#  1. FREE TIER (no persistent disk):
#     - Change `plan: starter` → `plan: free`
#     - Remove the entire `disk:` block
#     - Add: DB_CONNECTION=pgsql + DATABASE_URL=<neon/supabase url>
#     - Data will reset on every deploy (ephemeral storage)
#
#  2. PAID TIER (persistent disk, recommended for production):
#     - Keep `plan: starter` (or higher)
#     - Keep the `disk:` block
#     - Data survives restarts and deploys
#     - Cost: ~$7/month + $0.25/GB disk
#
#  3. To use PostgreSQL instead of SQLite:
#     - Add a PostgreSQL service below (uncomment)
#     - Set DB_CONNECTION=pgsql
#     - DATABASE_URL auto-wires via fromDatabase
# ═══════════════════════════════════════════════════════════════

# ─── Optional: Managed PostgreSQL ───

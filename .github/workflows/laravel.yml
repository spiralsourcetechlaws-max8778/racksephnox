# ═══════════════════════════════════════════════════════════════
#  R A C K S E P H N O X   ·   L A R A V E L   C I
#  PHP 8.4 · SQLite test DB · 888 Hz · Φ = 1.618
# ═══════════════════════════════════════════════════════════════
name: Laravel CI

on:
  push:
    branches: [ main, spiral, develop ]
  pull_request:
    branches: [ main, spiral, develop ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PHP_VERSION: '8.4'
  COMPOSER_NO_INTERACTION: 1

jobs:
  laravel-tests:
    name: Laravel Tests (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    timeout-minutes: 15

    strategy:
      fail-fast: false
      matrix:
        php: ['8.4']

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, pdo, pdo_sqlite, sqlite3, bcmath, ctype, fileinfo, json, tokenizer, xml, curl, zip, gd, intl
          coverage: none
          tools: composer:v2

      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.composer/cache/files
            ~/.cache/composer/files
            vendor
          key: composer-${{ runner.os }}-php-${{ matrix.php }}-${{ hashFiles('composer.lock', 'composer.json') }}
          restore-keys: |
            composer-${{ runner.os }}-php-${{ matrix.php }}-
            composer-${{ runner.os }}-

      # ─────────────────────────────────────────────────────
      # Prepare .env — critical for AppServiceProvider boot
      # ─────────────────────────────────────────────────────
      - name: Prepare .env
        run: |
          if [ ! -f .env ]; then
            if [ -f .env.example ]; then
              cp .env.example .env
            else
              touch .env
            fi
          fi
          {
            echo "APP_NAME=Racksephnox"
            echo "APP_ENV=testing"
            echo "APP_DEBUG=true"
            echo "APP_URL=http://localhost"
            echo "DB_CONNECTION=sqlite"
            echo "DB_DATABASE=/tmp/test_database.sqlite"
            echo "DB_FOREIGN_KEYS=true"
            echo "SESSION_DRIVER=array"
            echo "CACHE_STORE=array"
            echo "QUEUE_CONNECTION=sync"
            echo "MAIL_MAILER=array"
            echo "BROADCAST_CONNECTION=null"
          } > .env

      - name: Install Dependencies
        run: composer install -q --no-ansi --no-interaction --no-scripts --no-progress --prefer-dist

      - name: Generate key
        run: php artisan key:generate

      - name: Directory Permissions
        run: |
          mkdir -p storage/framework/{sessions,views,cache}
          mkdir -p storage/logs bootstrap/cache
          chmod -R 777 storage bootstrap/cache

      # ─────────────────────────────────────────────────────
      # Create BOTH test databases — /tmp and project
      # ─────────────────────────────────────────────────────
      - name: Create Test Databases
        run: |
          mkdir -p database
          touch /tmp/test_database.sqlite
          touch database/database.sqlite
          chmod 666 /tmp/test_database.sqlite
          chmod 666 database/database.sqlite
          ls -la /tmp/test_database.sqlite
          ls -la database/database.sqlite

      # ─────────────────────────────────────────────────────
      # Run migrations against the test DB
      # ─────────────────────────────────────────────────────
      - name: Run Migrations (test DB)
        env:
          DB_DATABASE: /tmp/test_database.sqlite
        run: php artisan migrate --force
        continue-on-error: true

      - name: Run Migrations (default DB)
        run: php artisan migrate --force
        continue-on-error: true

      # ─────────────────────────────────────────────────────
      # Execute tests
      # ─────────────────────────────────────────────────────
      - name: Execute tests
        env:
          DB_CONNECTION: sqlite
          DB_DATABASE: /tmp/test_database.sqlite
        run: php artisan test --colors=always

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: laravel-logs-php-${{ matrix.php }}
          path: |
            storage/logs/*.log
          retention-days: 7
          if-no-files-found: ignore

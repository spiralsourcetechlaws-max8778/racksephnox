name: Laravel CI

on:
  push:
    branches: [main, spiral, develop]
  pull_request:
    branches: [main, spiral, develop]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PHP_VERSION: '8.4'
  COMPOSER_NO_INTERACTION: 1

jobs:
  tests:
    name: Laravel Tests (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    timeout-minutes: 15

    strategy:
      fail-fast: false
      matrix:
        php: ['8.4']

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, pdo, pdo_sqlite, pdo_pgsql, sqlite3, bcmath, ctype, fileinfo, json, tokenizer, xml, curl, zip, gd, intl
          coverage: none
          tools: composer:v2

      - name: Cache Composer
        uses: actions/cache@v4
        with:
          path: |
            ~/.composer/cache/files
            vendor
          key: composer-${{ runner.os }}-php-${{ matrix.php }}-${{ hashFiles('composer.lock') }}
          restore-keys: composer-${{ runner.os }}-php-${{ matrix.php }}-

      - name: Prepare .env
        run: |
          [ -f .env ] || cp .env.example .env 2>/dev/null || touch .env
          {
            echo "APP_NAME=Racksephnox"
            echo "APP_ENV=testing"
            echo "APP_DEBUG=true"
            echo "APP_URL=http://localhost"
            echo "DB_CONNECTION=sqlite"
            echo "DB_DATABASE=/tmp/test_database.sqlite"
            echo "SESSION_DRIVER=array"
            echo "CACHE_STORE=array"
            echo "QUEUE_CONNECTION=sync"
            echo "MAIL_MAILER=array"
          } > .env

      - name: Install Dependencies
        run: composer install --no-interaction --prefer-dist --no-scripts

      - name: Generate Key
        run: php artisan key:generate

      - name: Directory Permissions
        run: |
          mkdir -p storage/framework/{sessions,views,cache}
          mkdir -p storage/logs bootstrap/cache
          chmod -R 777 storage bootstrap/cache

      - name: Create Test Database
        run: |
          touch /tmp/test_database.sqlite
          chmod 666 /tmp/test_database.sqlite

      - name: Run Migrations
        run: php artisan migrate --force
        continue-on-error: true

      - name: Execute Tests
        run: php artisan test --colors=always

      - name: Upload Logs on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: laravel-logs-php-${{ matrix.php }}
          path: storage/logs/*.log
          retention-days: 7
          if-no-files-found: ignore

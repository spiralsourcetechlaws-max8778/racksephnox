name: Docker Build & Push

on:
  push:
    branches: [ main, spiral, develop ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.github/ISSUE_TEMPLATE/**'
  pull_request:
    branches: [ main ]
  workflow_dispatch:      # allows manual trigger from GitHub UI

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    timeout-minutes: 30

    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      # ─────────────────────────────────────────────────────
      # 1. Checkout
      # ─────────────────────────────────────────────────────
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      # ─────────────────────────────────────────────────────
      # 2. Set up QEMU (for multi-architecture builds)
      # ─────────────────────────────────────────────────────
      - name: 🏗 Set up QEMU
        uses: docker/setup-qemu-action@v3

      # ─────────────────────────────────────────────────────
      # 3. Set up Docker Buildx (BuildKit)
      # ─────────────────────────────────────────────────────
      - name: 🔧 Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ─────────────────────────────────────────────────────
      # 4. Log in to GitHub Container Registry
      # ─────────────────────────────────────────────────────
      - name: 🔐 Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ─────────────────────────────────────────────────────
      # 5. Extract metadata (tags, labels)
      # ─────────────────────────────────────────────────────
      - name: 🏷 Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha,prefix=sha-,format=short
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=888hz

      # ─────────────────────────────────────────────────────
      # 6. Build and push
      # ─────────────────────────────────────────────────────
      - name: 🚀 Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64,linux/arm64
          build-args: |
            APP_ENV=production
            BUILDKIT_INLINE_CACHE=1
          provenance: true
          sbom: true

      # ─────────────────────────────────────────────────────
      # 7. Print image digest for reference
      # ─────────────────────────────────────────────────────
      - name: 📋 Image digest
        run: echo "✅ Built image digest: ${{ steps.build.outputs.digest }}"

      # ─────────────────────────────────────────────────────
      # 8. Summary
      # ─────────────────────────────────────────────────────
      - name: 📊 Build summary
        run: |
          echo "### ✅ Docker Build Successful" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Registry:** \`${{ env.REGISTRY }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Image:** \`${{ env.IMAGE_NAME }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Tags:**" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "${{ steps.meta.outputs.tags }}" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

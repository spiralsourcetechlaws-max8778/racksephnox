name: Deploy to Render

on:
  push:
    branches: [main, spiral]
  workflow_dispatch:

jobs:
  test:
    name: Test Before Deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo_sqlite, pdo_pgsql, bcmath, ctype, fileinfo, json, tokenizer, xml, curl, zip, gd, intl
          coverage: none
          tools: composer:v2

      - name: Cache Composer
        uses: actions/cache@v4
        with:
          path: vendor
          key: composer-${{ hashFiles('composer.lock') }}

      - name: Install Dependencies
        run: composer install --no-interaction --prefer-dist --no-scripts

      - name: Prepare Environment
        run: |
          cp .env.example .env 2>/dev/null || touch .env
          php artisan key:generate
          mkdir -p database
          touch database/database.sqlite
          chmod 666 database/database.sqlite

      - name: Run Migrations
        run: php artisan migrate --force

      - name: Run Tests
        run: php artisan test --colors=always

  deploy:
    name: Trigger Render Deploy
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/spiral' || github.ref == 'refs/heads/main'
    steps:
      - name: Trigger Deploy Hook
        run: |
          if [ -z "${{ secrets.RENDER_DEPLOY_HOOK }}" ]; then
            echo "⚠️  RENDER_DEPLOY_HOOK secret not set — skipping"
            exit 0
          fi
          curl -X POST "${{ secrets.RENDER_DEPLOY_HOOK }}" \
            -H "Accept: application/json" \
            --fail --silent --show-error
          echo "✅ Deploy triggered"

      - name: Summary
        run: |
          echo "### ✅ Render Deploy Triggered" >> $GITHUB_STEP_SUMMARY
          echo "**Branch:** ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          echo "**Commit:** ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "**Actor:** ${{ github.actor }}" >> $GITHUB_STEP_SUMMARY

version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: racksephnox-app
    restart: unless-stopped
    ports:
      - "8000:10000"
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      APP_URL: http://localhost:8000
      DB_CONNECTION: sqlite
      DB_DATABASE: /var/www/html/database/database.sqlite
      SESSION_DRIVER: database
      CACHE_STORE: file
      QUEUE_CONNECTION: database
      RUN_MIGRATIONS: "true"
      RUN_SEEDERS: "true"
    volumes:
      - ./database:/var/www/html/database
      - ./storage:/var/www/html/storage
    networks:
      - racksephnox

  queue:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: racksephnox-queue
    restart: unless-stopped
    command: php artisan queue:work --sleep=3 --tries=3 --max-time=3600
    environment:
      APP_ENV: local
      DB_CONNECTION: sqlite
      DB_DATABASE: /var/www/html/database/database.sqlite
      QUEUE_CONNECTION: database
      RUN_MIGRATIONS: "false"
    volumes:
      - ./database:/var/www/html/database
      - ./storage:/var/www/html/storage
    depends_on:
      - app
    networks:
      - racksephnox

  scheduler:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: racksephnox-scheduler
    restart: unless-stopped
    command: sh -c "while true; do php artisan schedule:run --verbose --no-interaction; sleep 60; done"
    environment:
      APP_ENV: local
      DB_CONNECTION: sqlite
      DB_DATABASE: /var/www/html/database/database.sqlite
      RUN_MIGRATIONS: "false"
    volumes:
      - ./database:/var/www/html/database
      - ./storage:/var/www/html/storage
    depends_on:
      - app
    networks:
      - racksephnox

networks:
  racksephnox:
    driver: bridge
